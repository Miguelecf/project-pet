schema: spec-driven

context: |
  Project: project-pet
  Stack: React 18 + TypeScript + Vite + Supabase + Netlify (free tier)
  Architecture: Modular monolith, clean architecture pragmatic, feature-based modules
  Status: Vite scaffold complete, Supabase client isolated (A0.3), Vitest installed (A0.4)
  Testing: Vitest active, Strict TDD enabled after A0.4

strict_tdd: true

testing:
  test_runner: vitest
  test_command: "npm run test:run"
  unit: true
  integration: false
  e2e: false
  coverage: true
  linter: false
  type_checker: true
  formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "npm run test:run"
  verify:
    test_command: "npm run test:run"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
