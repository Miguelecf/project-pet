schema: spec-driven

context: |
  Project: project-pet
  Stack: React 19.2, TypeScript 6 strict, Vite 8, Vitest 4, Testing Library, Supabase JS 2
  Architecture: local-first modular monolith; feature modules, domain contracts, replaceable adapters
  Boundary: @supabase/supabase-js is isolated to src/lib/supabase; no product code may import it directly
  Current delivery: local demonstrable MVP; remote auth/database/RLS/deploy are deferred to productization
  Quality: Strict TDD; Vitest unit/type/component tests; Oxlint; TypeScript build; V8 coverage
  Workflow: hybrid OpenSpec + Engram, automatic execution, mainline milestone commits, 800 changed-line review guard

strict_tdd: true

testing:
  test_runner: "Vitest 4.1.10"
  test_command: "npm run test:run"
  unit: true
  component: true
  integration: false
  e2e: false
  coverage: true
  coverage_command: "npm run test:coverage"
  linter: true
  lint_command: "npm run lint"
  type_checker: true
  type_check_command: "npm run build"
  build_command: "npm run build"
  formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Keep local-MVP scope separate from deferred Supabase productization work
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Keep @supabase/supabase-js imports inside src/lib/supabase
    - Use RED-GREEN-REFACTOR for each behavior change
    - Stop and split the delivery before a milestone exceeds 800 changed lines
    tdd: true
    test_command: "npm run test:run"
  verify:
    test_command: "npm run test:run"
    build_command: "npm run build"
    lint_command: "npm run lint"
    coverage_command: "npm run test:coverage"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
