schema: spec-driven

context: |
  Project: project-pet
  Stack: React 18 + TypeScript + Vite + Supabase + Netlify (free tier)
  Architecture: Modular monolith, clean architecture pragmatic, feature-based modules
  Status: Docs-only repo — Vite scaffold not yet executed
  Testing: Vitest (planned), Strict TDD disabled until scaffolding

strict_tdd: false

testing:
  test_runner: vitest
  test_command: ""
  unit: false
  integration: false
  e2e: false
  coverage: false
  linter: false
  type_checker: false
  formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
